<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="倒计时任务管理应用">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    
    <!-- 关键CSS内联 - 仅首屏必要样式 -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif}
      #app{min-height:100vh;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%)}
      .home-container{padding:20px;min-height:70vh}
      .home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px}
      .home-title{font-size:32px;font-weight:600;color:#2c3e50}
      .countdown-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,300px));gap:16px;justify-content:center}
      .countdown-card{background:rgba(255,255,255,0.95);border-radius:24px;padding:20px 24px;display:flex;flex-direction:row;align-items:center;gap:20px;box-shadow:0 8px 32px rgba(0,0,0,0.06)}
      .countdown-days{font-size:76px;font-weight:900;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-width:130px;text-align:center}
      .countdown-info{flex:1;text-align:left}
      .card-title{font-size:18px;font-weight:600;color:#2c3e50}
      .card-date{font-size:14px;color:#7f8c8d}
      .add-card{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px;border:2px dashed #bdc3c7;cursor:pointer}
      .skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,300px));gap:16px;justify-content:center}
      .skeleton-card{background:rgba(255,255,255,0.95);border-radius:24px;padding:20px;display:flex;gap:16px}
      .skeleton-days{width:130px;height:76px;border-radius:4px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skeleton 1.5s infinite}
      .skeleton-info{flex:1;display:flex;flex-direction:column;gap:8px}
      .skeleton-title{height:20px;border-radius:4px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;width:80%}
      .skeleton-date{height:14px;border-radius:4px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;width:60%}
      @keyframes skeleton{0%{background-position:-200% 0}100%{background-position:200% 0}}
    </style>
    
    <!-- DNS预解析 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
