<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="倒计时任务管理应用">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    
    <!-- 字体回退优化 -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Inter'), local('Helvetica Neue'), sans-serif;
      }
      
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Inter Bold'), local('Helvetica Neue Bold'), sans-serif;
      }
    </style>
    
    <!-- 关键CSS内联 -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif}
      #app{min-height:100vh;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%)}
      .home-container{padding:20px;min-height:70vh}
      .home-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
      .home-title{font-size:32px;font-weight:600;color:#2c3e50}
      .countdown-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,300px));gap:16px;justify-content:center}
      .countdown-card{background:rgba(255,255,255,0.95);border-radius:24px;padding:20px 24px;display:flex;flex-direction:row;align-items:center;gap:20px;box-shadow:0 8px 32px rgba(0,0,0,0.06)}
      .countdown-days{font-size:76px;font-weight:900;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-width:130px;text-align:center}
      .countdown-info{flex:1;text-align:left}
      .card-title{font-size:18px;font-weight:600;color:#2c3e50}
      .card-date{font-size:14px;color:#7f8c8d}
      .add-card{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px;border:2px dashed #bdc3c7;cursor:pointer}
    </style>
    
    <!-- DNS预解析（仅关键域名） -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
